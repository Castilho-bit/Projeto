
services:
  - type: web
    name: api-upload-download
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UPLOAD_FOLDER
        value: uploads
      - key: DATABASE_PATH
        value: instance/uploads.db
