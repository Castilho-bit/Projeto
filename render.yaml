services:
  - type: web
    name: api-upload-download
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: DATABASE_PATH
        value: /var/data/uploads.db
    disk:
      name: api-data
      mountPath: /var/data
      sizeGB: 1
